spring:
  application:
    name: reservas
  datasource:
    url: jdbc:postgresql://172.17.0.2:5432/reservas_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      jakarta:
        persistence:
          lock:
            timeout: 10000
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

app:
  timezone: America/Bogota
  scheduling:
    enabled: true
    finalizacion-ms: 30000
